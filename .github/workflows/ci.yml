name: quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: topmed
          POSTGRES_USER: topmed
          POSTGRES_PASSWORD: topmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topmed -d topmed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://topmed:topmed@127.0.0.1:5432/topmed
      TOPMED_TEST_DATABASE_URL: postgresql+psycopg://topmed:topmed@127.0.0.1:5432/topmed
      TOPMED_REQUIRE_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            backend/pyproject.toml
      - run: python -m venv .venv
      - run: .venv/bin/pip install --requirement requirements-data.txt --editable './backend[dev]'
      - run: .venv/bin/python scripts/bootstrap_demo.py
      - run: .venv/bin/python -c "from app.config import Settings; from app.embeddings import ensure_model_artifacts, ensure_static_model_artifacts; s=Settings(_env_file=None); ensure_model_artifacts(s, download=True); ensure_static_model_artifacts(s, download=True)"
      - run: .venv/bin/alembic -c backend/alembic.ini upgrade head
      - run: .venv/bin/alembic -c backend/alembic.ini check
      - run: .venv/bin/ruff check --config backend/pyproject.toml backend
      - run: .venv/bin/ruff format --check --config backend/pyproject.toml backend
      - run: .venv/bin/mypy --config-file backend/pyproject.toml backend/app
      - run: .venv/bin/pytest backend/tests -q -m "not llm"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file backend/Dockerfile --tag topmed-api:ci .
      - run: >-
          docker build --file frontend/Dockerfile --tag topmed-web:ci
          --build-arg BACKEND_HOSTPORT=topmed-api:10000
          --build-arg BACKEND_ORIGIN=https://topmed-api.example
          --build-arg NEXT_PUBLIC_API_BASE_URL=https://topmed.example
          --build-arg NEXT_PUBLIC_WIDGET_ASSISTANT_KEY=topmed-ci
          --build-arg "TOPMED_FRAME_ANCESTORS=https://topmed.example"
          --build-arg TOPMED_PUBLIC_ORIGIN=https://topmed.example
          .
