services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: topmed-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topmed}
      POSTGRES_DB: ${POSTGRES_DB:-topmed}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - topmed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topmed} -d ${POSTGRES_DB:-topmed}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  topmed-postgres-data:
